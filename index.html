<style>
/* Layout: one 9:16 "phone" stage. A single dark map sits behind a scroll-snap stack of
   transparent incident cards; the map flies to whichever card is on screen. Dark-only by design
   (night dispatch board), so every color is set explicitly. */
:root {
  --night: #0a0e13;          /* page + map ground */
  --panel: rgba(10, 14, 19, .78);
  --ink: #f1f3f5;            /* primary text */
  --dim: #9aa6b2;            /* secondary text, blue-grey toward the map */
  --line: rgba(241, 243, 245, .14);
  --law: #4f8cff;            /* police blue */
  --fire: #ff6b2c;           /* engine orange */
  --road: #ffc21a;           /* road-sign amber */
  --live: #ff3b4e;           /* LIVE dot */
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.stage { position: relative; height: 100%; width: min(100%, calc(100dvh * 9 / 16)); margin: 0 auto; overflow: hidden; background: var(--night); }
@media (min-width: 700px) { .stage { box-shadow: 0 0 0 1px var(--line); } }

/* Map ground: a dispatch-grid shows through until (or if) tiles load */
#map { position: absolute; inset: 0; z-index: 0; background-color: var(--night);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px; }
#map .leaflet-tile-pane { filter: saturate(.6) brightness(.9); }
.leaflet-control-attribution { background: rgba(10,14,19,.7) !important; color: var(--dim) !important; font: 10px var(--body) !important; }
.leaflet-control-attribution a { color: var(--ink) !important; }
.shade { position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, rgba(10,14,19,.75) 0%, rgba(10,14,19,0) 18%, rgba(10,14,19,0) 40%, rgba(10,14,19,.92) 72%, var(--night) 100%); }

/* Pins */
.pin { --c: var(--law); width: 14px; height: 14px; border-radius: 50%; background: var(--c); border: 2px solid var(--night); box-shadow: 0 0 0 1px var(--c); opacity: .55; transition: transform .3s, opacity .3s; }
.pin.Fire { --c: var(--fire); } .pin.Road { --c: var(--road); }
.pin.on { opacity: 1; transform: scale(1.5); }
.pin.on::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--c); animation: ping 1.6s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(4); opacity: 0; } }

/* Top bar */
.top { position: absolute; z-index: 5; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 0; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 20px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.brand small { font: 500 11px/1 var(--mono); color: var(--dim); letter-spacing: .06em; }
.live { display: inline-flex; align-items: center; gap: 6px; font: 600 11px/1 var(--body); letter-spacing: .12em; background: var(--live); color: #fff; padding: 4px 7px; border-radius: 3px; }
.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.tabs { display: flex; gap: 6px; pointer-events: auto; overflow-x: auto; scrollbar-width: none; }
.tab { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--dim); white-space: nowrap; }
.tab[aria-pressed="true"] { color: var(--night); background: var(--ink); border-color: var(--ink); }

/* Feed */
.feed { position: absolute; inset: 0; z-index: 2; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; }
.feed::-webkit-scrollbar { display: none; }
.card { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; justify-content: flex-end;
  padding: 0 76px calc(env(safe-area-inset-bottom, 0px) + 58px) 16px; }
.card > * { min-width: 0; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.kind { --c: var(--law); font: 800 13px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--night); background: var(--c); padding: 5px 8px 4px; border-radius: 2px; }
.kind.Fire { --c: var(--fire); } .kind.Road { --c: var(--road); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink); border: 1px solid var(--line); background: var(--panel); padding: 3px 8px; border-radius: 2px; }
.status b { font: 500 11px/1 var(--mono); color: var(--dim); }
.ago { font-size: 12px; color: var(--dim); }
.new { font: 800 12px/1 var(--display); letter-spacing: .1em; color: var(--live); }
.event { margin: 0; font: 800 clamp(34px, 10.5vw, 52px)/.92 var(--display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; overflow-wrap: anywhere; }
.where { margin: 8px 0 0; font-size: 17px; font-weight: 600; }
.where span { color: var(--dim); font-weight: 400; }
.cad { margin: 6px 0 0; font: 500 11.5px/1.4 var(--mono); color: var(--dim); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.vo { margin: 14px 0 0; padding: 10px 12px; background: var(--panel); border-left: 3px solid var(--ink); font-size: 15px; line-height: 1.5; color: var(--dim); max-width: 60ch; }
.vo .w.on { color: var(--ink); background: rgba(241,243,245,.12); border-radius: 2px; }
.vo .w.done { color: var(--ink); }
.bar { position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 44px); height: 2px; background: var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); }

/* Right rail */
.rail { position: absolute; z-index: 6; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); display: flex; flex-direction: column; gap: 14px; }
.rb { width: 52px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; font-size: 11px; color: var(--ink); text-shadow: 0 1px 2px #000; }
.rb svg { width: 44px; height: 44px; padding: 10px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rb[aria-pressed="true"] svg { background: var(--ink); stroke: var(--night); }

/* Disclaimer + toast + start */
.disc { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); font-size: 11px; line-height: 1.35; color: var(--dim); background: var(--night); border-top: 1px solid var(--line); pointer-events: none; }
.toast { position: absolute; z-index: 9; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 92px); transform: translate(-50%, -8px); opacity: 0; transition: .25s; background: var(--ink); color: var(--night); font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.start { position: absolute; z-index: 8; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 150px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.start button { pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; border: 0; background: var(--ink); color: var(--night); font: 800 18px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 14px 20px; border-radius: 999px; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
.start button svg { width: 20px; height: 20px; fill: var(--night); }
.start p { margin: 0; font-size: 12px; color: var(--ink); text-shadow: 0 1px 3px #000; }
.empty { height: 100%; display: grid; place-items: center; text-align: center; padding: 0 32px; color: var(--dim); }

/* Clean mode: hides controls so the screen can be recorded as a Short */
.clean .tabs, .clean .rail, .clean .start, .clean .leaflet-control-zoom { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  .pin.on::after, .live::before { animation: none; }
  .feed { scroll-behavior: auto; }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div id="map" aria-hidden="true"></div>
  <div class="shade"></div>

  <header class="top">
    <div class="brand">CHA 911 <span class="live">LIVE</span> <small id="count">loading…</small></div>
    <nav class="tabs" aria-label="Filter incidents">
      <button class="tab" data-f="all" aria-pressed="true">All</button>
      <button class="tab" data-f="Law" aria-pressed="false">Police</button>
      <button class="tab" data-f="Fire" aria-pressed="false">Fire</button>
      <button class="tab" data-f="Road Closure" aria-pressed="false">Roads</button>
    </nav>
  </header>

  <section class="feed" id="feed" aria-label="Incident feed" tabindex="0"></section>

    const keep = state.list[state.active]?.id;
    state.all.unshift(inc);
    render(keep);
    toast(`New call: ${kindLabel(type)} · ${area}`);
  }

  (async () => {
    const ok = await fetchFeed(false);
    if (!ok) { try { load(JSON.parse($("#seed").textContent), false); } catch { render(); } }
    if (state.simulated) setInterval(simulateArrival, SIM_EVERY_MS);
    else setInterval(() => fetchFeed(true), REFRESH_MS);
  })();
})();
</script>
</body>
</html>
